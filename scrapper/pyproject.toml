[project]
name = "beisbol-scrapper"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "pydantic-settings",
    "pyyaml",
    "requests",
    "sqlalchemy",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
